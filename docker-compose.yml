services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn nutrihub.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-replace-with-a-long-random-secret}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DATABASE_URL: "postgres://nutrihub:nutrihub-secret@db:5432/nutrihub"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutrihub
      POSTGRES_USER: nutrihub
      POSTGRES_PASSWORD: "nutrihub-secret"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrihub -d nutrihub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
