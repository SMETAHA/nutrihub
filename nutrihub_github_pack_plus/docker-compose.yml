services:
  web:
    build: .
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@db:5432/nutrihub
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nutrihub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
