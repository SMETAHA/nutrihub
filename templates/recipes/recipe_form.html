{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}{% translate "Recipe" %}{% endblock %}

{% block content %}
<h1>{% translate "New recipe" %}</h1>

<form method="post" enctype="multipart/form-data" id="recipe-form">
  {% csrf_token %}
  {{ form.as_p }}

  <input type="hidden" name="ingredients_json" id="ingredients_json" value='{{ ingredients_json|safe }}'>

  <h3>{% translate "Ingredients" %}</h3>
  <div id="recipe-i18n" hidden
       data-piece="{% translate 'g/piece' %}"
       data-kcal="{% translate 'kcal' %}"
       data-delete="{% translate 'Delete' %}"
       data-select-product="{% translate 'Select a product' %}"
       data-enter-amount="{% translate 'Enter an amount' %}"></div>
  <div id="ingredient-list"></div>

  <div>
    <input type="text" id="product-search" placeholder="{% translate 'Search for a product...' %}">
    <div id="product-results"></div>
    <input type="number" id="product-amount" placeholder="{% translate 'Amount' %}">
    <select id="product-unit">
      <option value="g">{% translate "g" %}</option>
      <option value="ml">{% translate "ml" %}</option>
      <option value="pcs">{% translate "pcs" %}</option>
    </select>
    <input type="number" id="product-piece" placeholder="{% translate 'Weight per piece (g)' %}" style="display:none;">
    <button type="button" id="add-ingredient">{% translate "Add" %}</button>
  </div>

  <hr>
  <div>
    <p>{% translate "Total" %}: <span id="total-kcal">0</span> kcal</p>
  </div>

  <button type="submit">💾 {% translate "Save" %}</button>
</form>

<script src="{% static 'js/recipes_new.js' %}"></script>
{% endblock %}
