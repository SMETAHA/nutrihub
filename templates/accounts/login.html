{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate "Log in" %}{% endblock %}
{% block content %}
<h2>{% translate "Log in" %}</h2>
<form method="post" class="form-grid">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">{% translate "Log in" %}</button>
</form>
<p>{% translate "Don't have an account?" %} <a href="/accounts/register/">{% translate "Sign up" %}</a></p>
{% endblock %}
